name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aivoa
          POSTGRES_PASSWORD: aivoa
          POSTGRES_DB: aivoa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aivoa -d aivoa_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aivoa:aivoa@localhost:5432/aivoa_test
      TEST_DATABASE_URL: postgresql+psycopg://aivoa:aivoa@localhost:5432/aivoa_test
      AI_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --frozen --python 3.12
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
