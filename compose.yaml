services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aivoa
      POSTGRES_PASSWORD: aivoa
      POSTGRES_DB: aivoa
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivoa -d aivoa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
